services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "1"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-10240}
      MAX_ROOMS: ${MAX_ROOMS:-1000}
      MAX_MEMBERS_PER_ROOM: ${MAX_MEMBERS_PER_ROOM:-100}
      ROOM_IDLE_HOURS: ${ROOM_IDLE_HOURS:-24}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - app_data:/app/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app_data:
  caddy_data:
  caddy_config:
